## Background

<div style="display: flex; width: 100%; gap: 1.4rem; margin-top: 0.3em;">
<div style="flex: 1 1 0; min-width: 0;">
<div style="text-align: center; font-weight: bold; color: #d68910; margin-bottom: 0.1em;">OPD</div>
<img src="https://img.sophilex.top/img/opd_flow.png" style="width: 100%; height: auto; border: none; box-shadow: none; margin: 0;">
</div>
<div style="flex: 1 1 0; min-width: 0;">
<div style="text-align: center; font-weight: bold; color: #16a085; margin-bottom: 0.1em;">RL</div>
<img src="https://img.sophilex.top/img/rl_flow.png" style="width: 100%; height: auto; border: none; box-shadow: none; margin: 0;">
</div>
</div>
<div style="font-size: 0.58em; text-align: center; margin-top: 0.8em;">
$$\begin{aligned}
\nabla_{\theta}\mathcal{J}_{OPD}(\theta) &= \mathbb{E}_{x\sim\mathcal{D},\,y\sim\pi_{\theta}(\cdot|x)}\left[\sum_{t=1}^{T} \textcolor{orange}{\log\frac{\pi_{\theta}(y_t|x,y_{\lt t})}{\pi_T(y_t|x,y_{\lt t})}}\, \nabla_{\theta}\log\pi_{\theta}(y_t|x,y_{\lt t})\right] \\
\nabla_{\theta}\mathcal{J}_{RL}(\theta) &= \mathbb{E}_{x\sim\mathcal{D},\,y\sim\pi_{\theta}(\cdot|x)}\left[\sum_{t=1}^{T} \textcolor{teal}{A_t^{RL}}\, \nabla_{\theta}\log\pi_{\theta}(y_t|x,y_{\lt t})\right]
\end{aligned}$$
</div>
<div style="font-size: 0.62em; text-align: center; margin-top: 0.3em;">
$$\textcolor{orange}{A_t^{OPD}} = \log\frac{\pi_T(y_t|x,y_{\lt t})}{\pi_{\theta}(y_t|x,y_{\lt t})} \qquad\qquad \textcolor{teal}{A_t^{RL}} \propto R(x,y)$$
</div>

## How to modulate OPD signal 

<div style="font-size: 0.72em; margin-top: 0.3em;">Plain <b style="color: #d68910;">OPD</b>, and a naive <b style="color: #d68910;">OPD</b> <b>+</b> <b style="color: #16a085;">GRPO</b> sum, both <b>degrade in the mid-to-late stage</b> of training.</div>

<div style="display: flex; width: 100%; gap: 1.2rem; margin-top: 0.5em; align-items: center;">

<img src="https://img.sophilex.top/img/Pasted%20image%2020261125001613.png" style="width: 100%; height: auto; border: none; box-shadow: none; margin: 0;">

</div>
</div>

<div style="font-size: 0.62em; color: #666; text-align: center; margin-top: 0.4em;">Once off the teacher support, the token-level signal turns noisy</div>

<div class="fragment" style="font-size: 0.7em; font-weight: bold; color: #333; text-align: center; margin-top: 0.5em;">🤔 The <span style="color: #d68910;">OPD</span> signal must be modulated before combination<br>&mdash; with <u>which signal</u>, and <u>how</u>?</div>

## How to modulate OPD signal

<style>.tight-math mjx-container[display="true"]{margin:0.4em 0 !important;}</style>
<div class="tight-math" style="font-size: 0.8em;">

<div style="font-size: 0.6em; color: #777; text-align: center; margin-top: 0.2em;">$\textcolor{teal}{R} = \operatorname{sign}(\textcolor{teal}{A^{RL}}) \in \{+1,-1\}$ &nbsp;&nbsp;&middot;&nbsp;&nbsp; $\textcolor{orange}{A_t^{OPD}} =\log\frac{\pi_T(y_t|x,y_{\lt t})}{\pi_{ref}(y_t|x,y_{\lt t})}$ </div>

<div style="font-size: 0.62em; margin-top: 0.8em; border-left: 3px solid #d68910; padding-left: 0.6em;"><b>① RLSD</b>  <sup style="color:#888;">[1]</sup></div>
<div style="font-size: 0.72em; text-align: center; margin-top: 0.1em;">
$$A_t = \textcolor{teal}{R}\,\textcolor{orange}{A_t^{OPD}}$$
</div>
<div style="font-size: 0.55em; color: #666; text-align: center; margin-top: 0.3em;"><span style="color:#16a085;">$A^{RL} \gt 0$</span> : teacher-supported tokens get <b>more reward</b> &nbsp;&nbsp;&middot;&nbsp;&nbsp; <span style="color:#c0392b;">$A^{RL} \lt 0$</span> : teacher-rejected tokens take <b>more penalty</b></div>

<div class="fragment" data-fragment-index="0">
<div style="font-size: 0.62em; margin-top: 0.85em; border-left: 3px solid #16a085; padding-left: 0.6em;"><b>② OPDVR</b>  <sup style="color:#888;">[2]</sup></div>
<div style="font-size: 0.72em; text-align: center; margin-top: 0.1em;">
$$A_t = \textcolor{teal}{R}\cdot\mathrm{ReLU}\!\left(\textcolor{teal}{R}\,\textcolor{orange}{A_t^{OPD}}\right)$$
</div>
<table style="width: 100%; font-size: 0.55em; border-collapse: collapse; margin-top: 0.35em;">
<tr style="border-bottom: 1.5px solid #999; color: #555;">
<th style="text-align: left; padding: 0.2em 0.4em;">outcome</th>
<th style="text-align: left; padding: 0.2em 0.4em;">teacher signal</th>

</tr>
<tr style="border-bottom: 1px solid #eee;">
<td style="padding: 0.2em 0.4em; color: #16a085;">correct &nbsp;$A^{RL} \gt 0$</td>
<td style="padding: 0.2em 0.4em;">$A_t^{OPD} \gt 0$</td>
<td style="padding: 0.2em 0.4em;">$A_t = A_t^{OPD}$</td>
<td style="padding: 0.2em 0.4em; color: #16a085;">reinforce</td>
</tr>
<tr style="border-bottom: 1px solid #eee;">
<td style="padding: 0.2em 0.4em; color: #16a085;">correct &nbsp;$A^{RL} \gt 0$</td>
<td style="padding: 0.2em 0.4em;">$A_t^{OPD} \lt 0$</td>
<td style="padding: 0.2em 0.4em; color: #999;">$A_t = 0$</td>
<td style="padding: 0.2em 0.4em; color: #999;">do not push down</td>
</tr>
<tr style="border-bottom: 1px solid #eee;">
<td style="padding: 0.2em 0.4em; color: #c0392b;">wrong &nbsp;$A^{RL} \le 0$</td>
<td style="padding: 0.2em 0.4em;">$A_t^{OPD} \gt 0$</td>
<td style="padding: 0.2em 0.4em; color: #999;">$A_t = 0$</td>
<td style="padding: 0.2em 0.4em; color: #999;">do not reinforce</td>
</tr>
<tr>
<td style="padding: 0.2em 0.4em; color: #c0392b;">wrong &nbsp;$A^{RL} \le 0$</td>
<td style="padding: 0.2em 0.4em;">$A_t^{OPD} \lt 0$</td>
<td style="padding: 0.2em 0.4em;">$A_t = A_t^{OPD}$</td>
<td style="padding: 0.2em 0.4em; color: #c0392b;">suppress</td>
</tr>
</table>

                function cleanupLaserPointer() {
                toggleLaser(false);
                isFullscreen = false;
                document.body.classList.remove('is-fullscreen');
                revealElement.classList.remove('fullscreen');
                laserBtn.style.display = 'none';
                // 使用hideLaser辅助函数确保激光笔完全隐藏
                hideLaser();
            }

            // 全屏按钮点击事件
            fullscreenBtn.addEventListener('click', function() {
                isFullscreen = !isFullscreen;
                document.body.classList.toggle('is-fullscreen', isFullscreen);
                revealElement.classList.toggle('fullscreen', isFullscreen);
                
                if (isFullscreen) {
                    document.documentElement.requestFullscreen();
                    laserBtn.style.display = 'flex';
                    Reveal.layout();
                } else {
                    cleanupLaserPointer();
                }
            });

            // 监听全屏状态变化
            document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                cleanupLaserPointer();
                Reveal.layout();
            }
            });

            // 激光笔按钮点击事件
            laserBtn.addEventListener('click', function() {
                toggleLaser(!isLaserActive);
            });

            // 检测演示者视图的激光笔位置并同步
            window.addEventListener('storage', function(e) {
                // 处理激光笔位置同步
                if (e.key === LASER_KEY && (isInMainView() || isInPresentationView())) {
                    try {
                        const data = JSON.parse(e.newValue);
                        
                        // 计算当前窗口中的激光笔位置
                        const revealRect = revealElement.getBoundingClientRect();
                        
                        if (data.isVisible && isLaserActive) {
                            // 使用相对位置计算激光笔位置
                            const absX = data.x * revealRect.width + revealRect.left;
                            const absY = data.y * revealRect.height + revealRect.top;
                            
                            // 更新激光笔位置
                            requestAnimationFrame(() => {
                            laserPointer.style.display = 'block';
                            laserPointer.style.left = (absX - 4) + 'px';
                            laserPointer.style.top = (absY - 4) + 'px';
                            });
                        } else {
                            // 隐藏激光笔
                            requestAnimationFrame(() => {
                            laserPointer.style.display = 'none';
                            laserPointer.style.left = '-9999px';
                            laserPointer.style.top = '-9999px';
                            });
                        }
                    } 
                    catch (err) {
                        console.error('解析激光笔数据失败', err);
                        // 出错时也确保激光笔隐藏
                        requestAnimationFrame(() => {
                            laserPointer.style.display = 'none';
                            laserPointer.style.left = '-9999px';
                            laserPointer.style.top = '-9999px';
                        });
                    }
                }
            
                // 处理激光笔激活状态同步
                if (e.key === LASER_ACTIVE_KEY && (isInMainView() || isInPresentationView())) {
                    const isActive = e.newValue === 'true';
                    console.log('接收到激光笔状态同步:', isActive);
                    
                    // 只更新UI状态，不再触发事件，避免循环
                    isLaserActive = isActive;
                    
                    if (isActive) {
                        laserBtn.classList.add('active');
                        document.body.classList.add('cursor-hidden');
                    } else {
                        laserBtn.classList.remove('active');
                        document.body.classList.remove('cursor-hidden');
                        // 使用hideLaser辅助函数确保激光笔完全隐藏
                        hideLaser();
                    }
                }
            });
        
            // 鼠标移动事件
            document.addEventListener('mousemove', function(e) {
                // 只有当激光笔激活时才处理
                if (isLaserActive) {
                    const revealRect = revealElement.getBoundingClientRect();
                    const isInsideReveal = (
                    e.clientX >= revealRect.left &&
                    e.clientX <= revealRect.right &&
                    e.clientY >= revealRect.top &&
                    e.clientY <= revealRect.bottom
                    );
            
                    if (isInsideReveal) {
                    // 计算相对位置
                    const relX = (e.clientX - revealRect.left) / revealRect.width;
                    const relY = (e.clientY - revealRect.top) / revealRect.height;
                    
                    // 在本窗口中显示激光笔
                    requestAnimationFrame(() => {
                        laserPointer.style.display = 'block';
                        laserPointer.style.left = (e.clientX - 4) + 'px';
                        laserPointer.style.top = (e.clientY - 4) + 'px';
                    });
                    
                    // 将位置信息同步到其他窗口
                    if (isInPresenterView()) {
                        updateLaserPosition(relX, relY, true);
                    }
                    } else {
                    // 确保激光笔完全隐藏
                    requestAnimationFrame(() => {
                        laserPointer.style.display = 'none';
                        laserPointer.style.left = '-9999px';
                        laserPointer.style.top = '-9999px';
                    });
                    
                    // 通知其他窗口隐藏激光笔
                    if (isInPresenterView()) {
                        updateLaserPosition(0, 0, false);
                    }
                    }
                } else {
                    // 如果激光笔未激活，确保它被隐藏
                    requestAnimationFrame(() => {
                    laserPointer.style.display = 'none';
                    laserPointer.style.left = '-9999px';
                    laserPointer.style.top = '-9999px';
                    });
                }
            });
        
            // 鼠标离开窗口事件
            document.addEventListener('mouseleave', function() {
                if (isLaserActive) {
                    // 使用hideLaser辅助函数确保激光笔完全隐藏
                    hideLaser();
                }
            });
        
            // 鼠标进入窗口事件
            document.addEventListener('mouseenter', function(e) {
                if (isLaserActive) {
                    const revealRect = revealElement.getBoundingClientRect();
                    const isInsideReveal = (
                    e.clientX >= revealRect.left &&
                    e.clientX <= revealRect.right &&
                    e.clientY >= revealRect.top &&
                    e.clientY <= revealRect.bottom
                    );
            
                    if (isInsideReveal && isInPresenterView()) {
                    // 计算相对位置
                    const relX = (e.clientX - revealRect.left) / revealRect.width;
                    const relY = (e.clientY - revealRect.top) / revealRect.height;
                    
                    // 更新激光笔位置
                    updateLaserPosition(relX, relY, true);
                    }
                }
            });

            // ESC 键处理
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    // 区分演示者视图和其他视图的处理
                    if (isInPresenterView()) {
                    // 在演示者视图中，ESC 键只退出全屏，不关闭激光笔
                    if (isFullscreen || document.fullscreenElement) {
                        if (document.fullscreenElement) {
                        document.exitFullscreen();
                        }
                        isFullscreen = false;
                        document.body.classList.remove('is-fullscreen');
                        revealElement.classList.remove('fullscreen');
                        // 不关闭激光笔，但在演讲者模式下按钮保持隐藏
                        laserBtn.style.display = 'none';
                        Reveal.layout();
                    }
                    } else {
                    // 在其他视图中，ESC 键行为不变
                    cleanupLaserPointer();
                    }
                }
                    // Alt 键切换激光笔（在所有视图中都有效）
                if (e.key === 'Alt') {
                    e.preventDefault(); // 防止触发浏览器默认行为
                    toggleLaser(!isLaserActive);
                }
            });
                
            // 添加 Alt 键释放处理
            document.addEventListener('keyup', function(e) {
            if (e.key === 'Alt') {
                e.preventDefault(); // 防止触发浏览器默认行为
            }
            });

            // 在页面加载时检查激光笔按钮显示状态
            window.addEventListener('load', function() {
                // 如果是演示者视图，不显示激光笔按钮和全屏按钮
                if (isInPresenterView()) {
                    console.log('当前是演示者视图，隐藏激光笔按钮和全屏按钮');
                    laserBtn.style.display = 'none';
                    fullscreenBtn.style.display = 'none';
                }
                
                // 如果是展示视图或主视图，检查是否有激光笔位置信息
                if (isInPresentationView() || isInMainView()) {
                    console.log('当前是展示视图或主视图，准备接收激光笔位置');
                    
                    // 检查激光笔激活状态
                    const laserActiveState = localStorage.getItem(LASER_ACTIVE_KEY);
                    if (laserActiveState === 'true') {
                    console.log('检测到激光笔处于激活状态');
                    isLaserActive = true;
                    laserBtn.classList.add('active');
                    document.body.classList.add('cursor-hidden');
                    } else {
                    // 如果激光笔未激活，确保它被隐藏
                    requestAnimationFrame(() => {
                        laserPointer.style.display = 'none';
                        laserPointer.style.left = '-9999px';
                        laserPointer.style.top = '-9999px';
                    });
                    }
                    
                    // 立即检查是否有存储的激光笔位置
                    const storedPosition = localStorage.getItem(LASER_KEY);
                    if (storedPosition) {
                    try {
                        const data = JSON.parse(storedPosition);
                        // 如果数据不是太旧（10秒内），并且激光笔当前处于激活状态，则应用它
                        if (Date.now() - data.timestamp < 10000 && data.isVisible && isLaserActive) {
                        const revealRect = revealElement.getBoundingClientRect();
                        const absX = data.x * revealRect.width + revealRect.left;
                        const absY = data.y * revealRect.height + revealRect.top;
                        
                        requestAnimationFrame(() => {
                            laserPointer.style.display = 'block';
                            laserPointer.style.left = (absX - 4) + 'px';
                            laserPointer.style.top = (absY - 4) + 'px';
                        });
                        } else {
                        // 数据过期或激光笔未激活，确保激光笔隐藏
                        requestAnimationFrame(() => {
                            laserPointer.style.display = 'none';
                            laserPointer.style.left = '-9999px';
                            laserPointer.style.top = '-9999px';
                        });
                        }
                    } catch (err) {
                        console.error('解析存储的激光笔位置失败', err);
                        // 解析失败时隐藏激光笔
                        requestAnimationFrame(() => {
                        laserPointer.style.display = 'none';
                        laserPointer.style.left = '-9999px';
                        laserPointer.style.top = '-9999px';
                        });
                    }
                    }
                }
            });

            // 检测演示窗口的关闭，以便更新状态
            window.addEventListener('beforeunload', function() {
                // 如果是演示者视图，通知其他视图不再自动全屏
                if (isInPresenterView()) {
                    localStorage.removeItem('reveal_auto_fullscreen');
                    localStorage.removeItem('reveal_auto_fullscreen_timestamp');
                }
            });

            // 更新激光笔按钮的提示文字
            document.querySelector('#laser-btn').title = '激光笔 (Alt + O 切换)';

            // 窗口大小改变事件 - 恢复此事件处理以便在调整大小时正确处理激光笔
            window.addEventListener('resize', function() {
            if (!isFullscreen) {
                cleanupLaserPointer();
            }
            });

            // 为主动隐藏激光笔添加一个帮助函数
            function hideLaser() {
                requestAnimationFrame(() => {
                    laserPointer.style.display = 'none';
                    laserPointer.style.left = '-9999px';
                    laserPointer.style.top = '-9999px';
                });
                
                if (isInPresenterView()) {
                    updateLaserPosition(0, 0, false);
                }
            }

            // 确保在窗口失去焦点时隐藏激光笔
            window.addEventListener('blur', function() {
                if (isLaserActive) {
                    hideLaser();
                }
                });
                
                // 确保在页面可见性改变时处理激光笔
                document.addEventListener('visibilitychange', function() {
                if (document.hidden && isLaserActive) {
                    hideLaser();
                }
            });

            document.addEventListener('DOMContentLoaded', () => {
                const refs = document.querySelectorAll('.slide-ref');

                refs.forEach(ref => {
                    const lines = ref.textContent.split('\n').map(line => line.trim()).filter(line => line.length > 0);

                    ref.innerHTML = `
                    <div style="width: 100px; height: 1px; background: black; margin-bottom: 5px;"></div>
                    <p style="margin: 2px 0;">${lines.join('<br>')}</p>
                    `;
                });
            });



        </script>
    </body>
</html>
